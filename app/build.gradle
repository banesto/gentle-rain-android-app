plugins { id 'com.android.application' }

android {
    namespace 'lv.quietnoise'
    compileSdk 35
    defaultConfig {
        applicationId 'lv.quietnoise'
        minSdk 26
        targetSdk 35
        versionCode 24
        versionName '1.0.23'
        testInstrumentationRunner 'lv.quietnoise.PlaybackSmokeTest'
    }
    androidResources { noCompress 'wav' }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
